<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Image Resizer - PDFConverter07</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:white;
padding:18px 20px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.logo{
max-width:1000px;
margin:auto;
font-size:23px;
font-weight:bold;
}

.logo span{color:#2563eb}

.container{
max-width:600px;
margin:40px auto;
padding:0 15px;
}

.box{
background:white;
padding:28px;
border-radius:18px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
text-align:center;
}

h1{font-size:30px}

p{color:#667085}

input[type=file]{
width:100%;
padding:12px;
margin:15px 0;
}

input[type=number]{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
border-radius:8px;
}

label{
display:block;
text-align:left;
font-weight:bold;
margin-top:15px;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:18px;
}

button:hover{
background:#1d4ed8;
}

#status{
margin-top:18px;
font-weight:bold;
}

.back{
display:block;
margin-top:20px;
text-decoration:none;
color:#2563eb;
}

footer{
margin-top:50px;
background:#172033;
color:white;
text-align:center;
padding:25px;
font-size:14px;
}
</style>
</head>

<body>

<header>
<div class="logo">
PDF<span>Converter07</span>
</div>
</header>

<div class="container">

<div class="box">

<h1>📐 Image Resizer</h1>

<p>Resize your image to the exact width and height.</p>

<input type="file" id="image" accept="image/*">

<label>Width (pixels)</label>
<input type="number" id="width" placeholder="Example: 1080">

<label>Height (pixels)</label>
<input type="number" id="height" placeholder="Example: 1080">

<button onclick="resizeImage()">
Resize & Download
</button>

<div id="status"></div>

<a class="back" href="index.html">
← Back to Home
</a>

</div>

</div>

<footer>
© 2026 PDFConverter07 · Free Online Tools
</footer>

<script>

function resizeImage(){

const file=document.getElementById("image").files[0];

const width=parseInt(document.getElementById("width").value);

const height=parseInt(document.getElementById("height").value);

const status=document.getElementById("status");

if(!file){

status.innerHTML="⚠️ Please select an image.";

return;

}

if(!width || !height || width<=0 || height<=0){

status.innerHTML="⚠️ Enter a valid width and height.";

return;

}

status.innerHTML="⏳ Resizing image...";

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=function(){

const canvas=document.createElement("canvas");

canvas.width=width;

canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,width,height);

canvas.toBlob(function(blob){

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download="resized-image.jpg";

a.click();

URL.revokeObjectURL(url);

status.innerHTML="✅ Resized image downloaded!";

},"image/jpeg",0.92);

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}

</script>

</body>
</html>
