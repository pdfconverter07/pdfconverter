<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF to JPG Converter - PDFConverter07</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:white;
padding:18px 20px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.logo{
max-width:1000px;
margin:auto;
font-size:23px;
font-weight:bold;
}

.logo span{color:#2563eb}

.container{
max-width:600px;
margin:40px auto;
padding:0 15px;
}

.box{
background:white;
padding:28px;
border-radius:18px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
text-align:center;
}

h1{font-size:30px}

p{color:#667085}

input[type=file]{
width:100%;
padding:12px;
margin:20px 0;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#status{
margin-top:18px;
font-weight:bold;
}

.back{
display:block;
margin-top:20px;
text-decoration:none;
color:#2563eb;
}

footer{
margin-top:50px;
background:#172033;
color:white;
text-align:center;
padding:25px;
font-size:14px;
}
</style>
</head>

<body>

<header>
<div class="logo">
PDF<span>Converter07</span>
</div>
</header>

<div class="container">

<div class="box">

<h1>🖼️ PDF to JPG Converter</h1>

<p>Select a PDF and convert its pages into JPG images.</p>

<input type="file" id="pdfFile" accept="application/pdf">

<button onclick="convertPDF()">
Convert to JPG
</button>

<div id="status"></div>

<a class="back" href="index.html">
← Back to Home
</a>

</div>

</div>

<footer>
© 2026 PDFConverter07 · Free Online Tools
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function convertPDF(){

const file=document.getElementById("pdfFile").files[0];

const status=document.getElementById("status");

if(!file){

status.innerHTML="⚠️ Please select a PDF first.";

return;

}

status.innerHTML="⏳ Converting PDF...";

try{

const arrayBuffer=await file.arrayBuffer();

const pdf=await pdfjsLib.getDocument({
data:arrayBuffer
}).promise;

for(let i=1;i<=pdf.numPages;i++){

const page=await pdf.getPage(i);

const viewport=page.getViewport({
scale:2
});

const canvas=document.createElement("canvas");

const context=canvas.getContext("2d");

canvas.width=viewport.width;
canvas.height=viewport.height;

await page.render({
canvasContext:context,
viewport:viewport
}).promise;

const link=document.createElement("a");

link.download="page-"+i+".jpg";

link.href=canvas.toDataURL("image/jpeg",0.9);

link.click();

await new Promise(resolve=>setTimeout(resolve,300));

}

status.innerHTML="✅ JPG images downloaded successfully!";

}catch(error){

status.innerHTML="❌ Unable to convert this PDF.";

}

}

</script>

</body>
</html>
