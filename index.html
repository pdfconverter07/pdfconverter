<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free JPG to PDF Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #222;
    }

    p {
      color: #666;
    }

    input {
      margin: 20px 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
    }

    #status {
      margin-top: 15px;
      color: #444;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>JPG to PDF</h1>
  <p>Convert your images to PDF for free.</p>

  <input type="file" id="images" accept="image/jpeg,image/png" multiple>

  <br>

  <button onclick="makePDF()">Convert to PDF</button>

  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
async function makePDF() {

  const files = document.getElementById("images").files;
  const status = document.getElementById("status");

  if (files.length === 0) {
    status.innerHTML = "Please select an image.";
    return;
  }

  status.innerHTML = "Creating PDF...";

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  for (let i = 0; i < files.length; i++) {

    const image = await readImage(files[i]);

    if (i > 0) {
      pdf.addPage();
    }

    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();

    let width = pageWidth - 20;
    let height = (image.height * width) / image.width;

    if (height > pageHeight - 20) {
      height = pageHeight - 20;
      width = (image.width * height) / image.height;
    }

    const x = (pageWidth - width) / 2;
    const y = (pageHeight - height) / 2;

    pdf.addImage(image.src, "JPEG", x, y, width, height);
  }

  pdf.save("converted.pdf");

  status.innerHTML = "PDF downloaded successfully!";
}

function readImage(file) {

  return new Promise((resolve) => {

    const reader = new FileReader();

    reader.onload = function(e) {

      const img = new Image();

      img.onload = function() {
        resolve({
          src: e.target.result,
          width: img.width,
          height: img.height
        });
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}
</script>

</body>
</html>
