<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Contact Us - PDFConverter07</title>

<meta name="description" content="Contact PDFConverter07 for questions, feedback and support.">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:#fff;
padding:18px 20px;
box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.logo{
max-width:900px;
margin:auto;
font-size:23px;
font-weight:bold;
}

.logo span{
color:#2563eb;
}

.container{
max-width:700px;
margin:40px auto;
padding:0 20px;
}

.box{
background:#fff;
padding:30px;
border-radius:18px;
box-shadow:0 6px 25px rgba(0,0,0,.07);
}

h1{
margin-top:0;
}

p{
color:#667085;
line-height:1.7;
}

input,
textarea{
width:100%;
padding:13px;
margin:8px 0 15px;
border:1px solid #d5d9e2;
border-radius:8px;
font-family:Arial;
font-size:15px;
}

textarea{
height:140px;
resize:vertical;
}

button{
width:100%;
padding:14px;
border:0;
border-radius:9px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.back{
display:block;
margin-top:20px;
color:#2563eb;
text-decoration:none;
}

footer{
margin-top:50px;
background:#172033;
color:#fff;
text-align:center;
padding:25px;
}
</style>
</head>

<body>

<header>

<div class="logo">
PDF<span>Converter07</span>
</div>

</header>

<div class="container">

<div class="box">

<h1>Contact Us</h1>

<p>
Have a question, suggestion or found a problem with one of our
tools? You can contact us using the form below.
</p>

<form onsubmit="sendMessage(event)">

<label>Name</label>

<input
type="text"
id="name"
placeholder="Your name"
required
>

<label>Email</label>

<input
type="email"
id="email"
placeholder="Your email"
required
>

<label>Message</label>

<textarea
id="message"
placeholder="Write your message..."
required
></textarea>

<button type="submit">
Send Message
</button>

</form>

<div id="status"></div>

<a class="back" href="index.html">
← Back to Home
</a>

</div>

</div>

<footer>
© 2026 PDFConverter07 · Free Online Tools
</footer>

<script>

function sendMessage(event){

event.preventDefault();

const name=document.getElementById("name").value;

const email=document.getElementById("email").value;

const message=document.getElementById("message").value;

const subject=encodeURIComponent(
"PDFConverter07 Contact - "+name
);

const body=encodeURIComponent(
"Name: "+name+
"\nEmail: "+email+
"\n\nMessage:\n"+message
);

/*
Replace this email address with your real
support email before publishing.
*/

window.location.href=
"mailto:jaiminthakor124@gmail.com?subject="+
subject+
"&body="+
body;

}

</script>

</body>
</html>
